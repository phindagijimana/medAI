# MedAI-EPI — one-command local deployment.
#
#   docker compose up               # GPU service on port 8085 (default)
#   docker compose --profile cpu up # CPU-only image on port 8086
#                                   # (offline components + mock backend
#                                   #  smoke tests; no Med42 inference)
#
# Requires:
#   - NVIDIA Container Toolkit installed on the host (for the GPU service)
#   - .env at repo root with at least APP_HOME, SECRET_KEY, HF_TOKEN filled in
#   - Hugging Face access to m42-health/Llama3-Med42-8B on first pull
#
# Weights are cached in ./model_cache/ and reused across container restarts.

services:

  medai-epi:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: medai-epi:gpu
    container_name: medai-epi
    ports:
      - "${SERVICE_PORT:-8085}:8085"
    env_file:
      - .env
    environment:
      SERVICE_HOST: 0.0.0.0
      MEDAI_REQUIRE_GPU: "1"
    volumes:
      - ./data/run_manifests:/app/data/run_manifests
      - ./model_cache:/root/.cache/huggingface
      - ./logs:/app/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # CPU-only image — no Med42 inference, but every offline endpoint works
  # (schema validation, chunker, merger, tabular flatten, CSV upload,
  # E2E smoke tests). Useful for CI and remote-GPU development.
  cpu:
    profiles: ["cpu"]
    build:
      context: .
      dockerfile: Dockerfile
    image: medai-epi:cpu
    container_name: medai-epi-cpu
    ports:
      - "${SERVICE_PORT_CPU:-8086}:8085"
    env_file:
      - .env
    environment:
      SERVICE_HOST: 0.0.0.0
      MEDAI_REQUIRE_GPU: "0"
    volumes:
      - ./data/run_manifests:/app/data/run_manifests
      - ./logs:/app/logs
    restart: unless-stopped
