site_name: LEO
site_description: Research phenotyping for epilepsy notes (MedAI-EPI)
site_url: https://medai.readthedocs.io/
docs_dir: docs_site
repo_url: https://github.com/phindagijimana/medAI
repo_name: GitHub
edit_uri: blob/main/docs/
copyright: Research use only. Synthetic notes unless IRB and approved compute.

# Same family as QSIPrep / Sphinx RTD (left sidebar + page TOC)
theme:
  name: readthedocs
  highlightjs: true
  hljs_languages:
    - bash
    - python
  collapse_navigation: false
  navigation_depth: 3
  titles_only: false
  include_homepage_in_sidebar: true
  prev_next_buttons_location: bottom

nav:
  - Home: index.md
  - Installation: LEO_HOSTING.md
  - Quick start: QUICKSTART.md
  - Usage: LEO_USER_GUIDE.md
  - Interpreting results: INTERPRETING_RESULTS.md
  - Routing rules: LEO_ROUTING_RULES.md
  - Design: IMPLEMENTATION.md
  - Weaknesses: WEAKNESSES.md
  - Learning: ACTIVE_LEARNING_PLAN.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - fenced_code

strict: true
